# ─── Parent Payment APIs (v2/parent) ────────────────────────────────────────

/v2/parent/payment/initiate:
  post:
    tags:
      - Payments (Parent)
    summary: Initiate a payment for fee dues
    security:
      - Authorization: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - sessionStudentId
              - feeDueIds
            properties:
              sessionStudentId:
                type: string
                example: "64a7b8c9d1e2f3g4h5i6j7k8"
              feeDueIds:
                type: array
                items:
                  type: string
                example: ["64a7b8c9d1e2f3g4h5i6j7k9"]
    responses:
      '200':
        description: Payment session created
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    paymentId:
                      type: string
                    paymentSessionId:
                      type: string
                    amount:
                      type: number
      '400':
        description: Invalid or already paid fee dues
      '404':
        description: Session student not found
      '409':
        description: Conflicting pending payment exists
      '503':
        description: Payment gateway not configured

/v2/parent/payment/{paymentId}/cancel:
  post:
    tags:
      - Payments (Parent)
    summary: Cancel a pending or created payment
    security:
      - Authorization: []
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Payment cancelled successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment:
                      type: object
      '400':
        description: Payment is not in a cancellable state
      '403':
        description: Unauthorized access to payment
      '404':
        description: Payment not found

/v2/parent/payment/history/{sessionStudentId}:
  get:
    tags:
      - Payments (Parent)
    summary: Get payment history for a session student
    security:
      - Authorization: []
    parameters:
      - name: sessionStudentId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Payment history retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payments:
                      type: array
                      items:
                        type: object
      '403':
        description: Unauthorized access to student
      '404':
        description: Session student not found

/v2/parent/payment/{paymentId}:
  get:
    tags:
      - Payments (Parent)
    summary: Get a single payment by ID
    security:
      - Authorization: []
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Payment retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payment:
                      type: object
      '403':
        description: Unauthorized access to payment
      '404':
        description: Payment not found

/v2/parent/receipt/{paymentId}:
  get:
    tags:
      - Payments (Parent)
    summary: Get receipt for a successful payment
    security:
      - Authorization: []
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Receipt retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    receipt:
                      type: object
                    payment:
                      type: object
      '403':
        description: Unauthorized access
      '404':
        description: Payment or receipt not found

# ─── Admin Payment APIs ──────────────────────────────────────────────────────

/payment/admin/zoho/secret:
  post:
    tags:
      - Payments (Admin)
    summary: Configure Zoho payment gateway for a school
    description: Fetches credentials from AWS Secrets Manager, generates an access token, registers a Zoho webhook, and saves the session.
    security:
      - Authorization: []
    responses:
      '200':
        description: Zoho payment gateway configured successfully
      '500':
        description: Internal server error

/payment/admin/history/{sessionStudentId}:
  get:
    tags:
      - Payments (Admin)
    summary: Get payment history for a session student (admin)
    security:
      - Authorization: []
    parameters:
      - name: sessionStudentId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Payment history retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    payments:
                      type: array
                      items:
                        type: object
      '404':
        description: Session student not found

/payment/admin/receipt/{receiptNo}:
  get:
    tags:
      - Payments (Admin)
    summary: Get receipt by receipt number (admin)
    security:
      - Authorization: []
    parameters:
      - name: receiptNo
        in: path
        required: true
        schema:
          type: string
        example: "RCPT-2024-000001"
    responses:
      '200':
        description: Receipt retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    receipt:
                      type: object
                    payment:
                      type: object
      '404':
        description: Receipt not found

# ─── Webhook & Callback ──────────────────────────────────────────────────────

/payment/zoho/webhook:
  post:
    tags:
      - Payments (Webhook)
    summary: Zoho payment webhook receiver
    description: Receives payment events from Zoho. Verifies the webhook signature and processes success or failure.
    parameters:
      - name: x-zoho-webhook-signature
        in: header
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '200':
        description: Webhook processed
      '401':
        description: Invalid webhook signature
      '404':
        description: Payment not found
      '503':
        description: Payment gateway not configured for school

/payment/callback:
  get:
    tags:
      - Payments (Webhook)
    summary: Payment redirect callback
    description: Called by the payment gateway after a payment attempt. Returns the current payment status.
    parameters:
      - name: paymentId
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Payment status returned
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    paymentId:
                      type: string
                    status:
                      type: string
                      example: "SUCCESS"
                    amount:
                      type: number
                    paidAt:
                      type: string
                      format: date-time
      '400':
        description: paymentId is required
      '404':
        description: Payment not found
